# ===================================================================================
# Money Plant ML pipeline configuration.  All relative paths resolve from the project root.
# CLI flags on scripts override the matching keys; environment variables are listed in .env.example.
# ===================================================================================

project:
  name: money_plant_ml_pipeline
  model_version: "1.0.0"       # bump when feature set / training logic changes; artifacts are stored per run

seed: 42                        # global random seed (XGBoost, K-Means, Isolation Forest, splits)
timezone: Asia/Kolkata          # all timestamps are normalised to this zone; naive timestamps are ASSUMED to be in it

paths:
  default_input: data/raw/plant_sensor_data.csv
  processed_dir: data/processed        # the only place processed/quarantined data is written
  artifacts_dir: artifacts
  reports_dir: reports

data:
  # synthetic | real | mixed.  Recorded in every artifact + exposed by GET /metadata.
  # The supplied dataset carries an `is_synthetic_anomaly` helper column and contains no experimenter
  # confirmation of real measurements, so it is treated as SYNTHETIC. Change ONLY if you have verified real data.
  provenance: synthetic
  provenance_note: null         # optional free-text note stored in artifact metadata
  validated_on_real_plants: false

validation:
  mode: warn                    # fail | warn | quarantine   (see docs/TRAINING_AND_EVALUATION.md)
  save_quarantine: true         # write quarantined rows to processed_dir

features:
  rolling_windows: [3, 6, 12]   # trailing windows in observations (never centred)
  std_min_periods: 2
  baseline_window: 48           # past-only rolling baseline length (obs). 48 obs = 4 days at 2-hourly cadence
  baseline_min_periods: 6       # warm-up: baseline (and *_base_dev) are NaN until 6 past observations exist
  max_light: 100000             # lux; normaliser for light_soil_interaction
  long_windows: [24, 48]        # longer per-plant context: *_long{w}_mean (trailing mean) and *_long{w}_dev (value - past-only
                                #   mean; the 48-obs deviation is the existing *_base_dev). 24 obs = 2 days
  cross_plant:                  # deviation from the healthy-control plants measured at the same time (issue #5)
    enabled: true
    reference_plants: [1, 2, 3, 4]   # the experiment's healthy controls; cancels the shared room climate / session drift
    statistic: median           # median of the reference plants found (robust to one faulty control sensor)
    tolerance_minutes: 30       # as-of join: a reference reading counts if it is at or before the row, at most 30 min older
    windows: [3, 6, 12, 24, 48] # trailing per-plant means of each deviation

split:
  strategy: chronological       # chronological | group_holdout
  test_fraction: 0.25           # chronological: last 25% of unique timestamps are test (= last session in the supplied data)
  holdout_plants: [4, 8, 12, 16]  # group_holdout: unseen plants (one per experimental group)

classifier:
  class_weight: balanced        # none | balanced  (inverse-frequency sample weights on TRAIN only; +0.018 validation macro-F1
                                #   in 14/14 paired draws on the issue #5 feature set)
  num_boost_round: 300
  missing_reference_augmentation: 0.25  # train on 25% extra copies of TRAIN rows with the cross-plant features blanked, so a
                                #   reading without reference-plant context degrades gracefully instead of failing (see docs)
  xgboost_params:
    objective: multi:softprob
    eval_metric: mlogloss
    eta: 0.05
    max_depth: 4
    min_child_weight: 3
    subsample: 0.8
    colsample_bytree: 0.8
    reg_lambda: 2.0
    tree_method: hist
    nthread: 2
  baselines: [majority_class, logistic_regression]
  smoothing:                    # past-only temporal smoothing of the predicted probabilities (issue #5)
    method: hmm_forward_filter  # none | hmm_forward_filter
    window: 12                  # readings: the filter runs over the trailing 12 predictions of the plant (stateless)
    temperature: 0.3            # exponent on the per-reading evidence (chosen on sessions 2-3 validation, not on test)
    transition_pseudocount: 1.0 # add-one smoothing of the class-transition counts (fitted on TRAIN labels only)

clustering:
  k_min: 2
  k_max: 8
  k: null                       # null = choose k with best silhouette in [k_min, k_max]; or set an integer
  n_init: 10
  silhouette_sample_size: 5000

anomaly:
  contamination: 0.02           # expected outlier fraction (supplied data labels ~1.2%); adjustable
  n_estimators: 200
  max_samples: auto
  label_column: is_synthetic_anomaly   # evaluation ONLY, never an input
  evaluate_on: test             # test | all

explain:
  enabled: true                 # SHAP is optional; falls back with an explicit message if unavailable
  top_k: 5
  background_rows: 500          # rows used for global importance reports

recommendations:
  # Monitoring ranges are HEURISTIC and configurable. They are not validated biological thresholds.
  soil_low_pct: 25
  soil_fast_drop_pct_per_hr: -1.5
  daytime_hours: [9, 16]        # inclusive local hours in which low light is considered meaningful
  light_low_lux: 300
  light_high_lux: 20000
  temp_high_c: 32
  temp_low_c: 18
  humidity_low_pct: 40
  humidity_high_pct: 92         # single readings above this count as damp air
  vpd_high_kpa: 2.0
  climate_min_hits: 2           # climate check fires when this many of the last min_consistent_rows readings are out of range
  # Sustained-deviation bands on the 6-reading rolling mean (temperature_roll6_mean / humidity_roll6_mean):
  temp_mean_high_c: 30
  temp_mean_low_c: 20
  humidity_mean_low_pct: 60
  humidity_mean_high_pct: 88
  low_confidence_max_prob: 0.45
  min_consistent_rows: 3        # trailing readings that must agree before a persistent-condition suggestion

artifacts:
  allow_version_mismatch: false # true = only warn when sklearn/xgboost versions differ from the training environment

api:
  host: 127.0.0.1               # safe default. Use 0.0.0.0 only after reading docs/JETSON_DEPLOYMENT.md
  port: 8001
  max_history_rows: 500
  max_batch_items: 64
  max_reference_rows: 5000      # reference-plant readings accepted per request (shared across a batch)
