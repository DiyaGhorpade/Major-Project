# Model input feature selection.
# Feature names are produced by plant_ml.feature_engineering (see docs/FEATURE_ENGINEERING.md).
# Labels, identifiers and raw timestamps are FORBIDDEN as inputs (see plant_ml.schema.FORBIDDEN_MODEL_COLUMNS);
# the pipeline raises LeakageError if they are listed here, unless explicitly whitelisted below.

# Leakage-safe, justified identifier experiments only (empty by default; do not enable casually).
allow_identifier_experiments: []

classifier:
  # Issue #5 feature set, selected on validation folds inside sessions 1-3 (see docs/TRAINING_AND_EVALUATION.md):
  # deviations from the concurrent healthy-control plants (cancel the shared room climate), longer per-plant context and
  # time of day. Raw absolute sensor levels, short lags and dayofweek were dropped: with the deviations present they
  # added no validation gain (dayofweek is a calendar artefact for plants); elapsed_hours stays out (train/serve skew).
  features:
    - soil_ref_dev
    - soil_ref_dev_roll3
    - soil_ref_dev_roll6
    - soil_ref_dev_roll12
    - soil_ref_dev_roll24
    - soil_ref_dev_roll48
    - temperature_ref_dev
    - temperature_ref_dev_roll3
    - temperature_ref_dev_roll6
    - temperature_ref_dev_roll12
    - temperature_ref_dev_roll24
    - temperature_ref_dev_roll48
    - humidity_ref_dev
    - humidity_ref_dev_roll3
    - humidity_ref_dev_roll6
    - humidity_ref_dev_roll12
    - humidity_ref_dev_roll24
    - humidity_ref_dev_roll48
    - log_light_ref_dev
    - log_light_ref_dev_roll3
    - log_light_ref_dev_roll6
    - log_light_ref_dev_roll12
    - log_light_ref_dev_roll24
    - log_light_ref_dev_roll48
    - vpd_ref_dev
    - vpd_ref_dev_roll3
    - vpd_ref_dev_roll6
    - vpd_ref_dev_roll12
    - vpd_ref_dev_roll24
    - vpd_ref_dev_roll48
    - soil_long24_mean
    - soil_long48_mean
    - soil_long24_dev
    - soil_base_dev
    - temperature_long24_mean
    - temperature_long48_mean
    - temperature_long24_dev
    - temperature_base_dev
    - humidity_long24_mean
    - humidity_long48_mean
    - humidity_long24_dev
    - humidity_base_dev
    - log_light_long24_mean
    - log_light_long48_mean
    - log_light_long24_dev
    - log_light_base_dev
    - vpd_long24_mean
    - vpd_long48_mean
    - vpd_long24_dev
    - vpd_base_dev
    - hour
    - hour_sin
    - hour_cos

clustering:
  features:
    - soil
    - temperature
    - humidity
    - log_light
    - vpd
    - soil_rate_per_hr
    - soil_base_dev
    - temperature_base_dev
    - humidity_base_dev
    - log_light_base_dev
    - vpd_base_dev
    - soil_roll6_mean
    - temperature_roll6_mean
    - humidity_roll6_mean
    - light_roll6_mean
    - vpd_roll6_mean

anomaly:
  features:
    - soil
    - temperature
    - humidity
    - log_light
    - vpd
    - soil_diff1
    - temperature_diff1
    - humidity_diff1
    - light_diff1
    - vpd_diff1
    - soil_rate_per_hr
    - soil_base_dev
    - temperature_base_dev
    - humidity_base_dev
    - log_light_base_dev
    - vpd_base_dev
    - soil_roll6_std
    - temperature_roll6_std
    - humidity_roll6_std
    - light_soil_interaction
