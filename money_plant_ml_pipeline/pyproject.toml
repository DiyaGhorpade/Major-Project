[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "money-plant-ml-pipeline"
version = "1.0.0"
description = "Local ML pipeline (XGBoost, K-Means, Isolation Forest) for Money Plant monitoring on Jetson Orin Nano"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26", "pandas>=2.1", "scipy>=1.11", "scikit-learn>=1.4", "xgboost>=2.0", "pyyaml>=6.0",
  "joblib>=1.3", "pydantic>=2.5", "fastapi>=0.110", "uvicorn>=0.27",
]

[project.optional-dependencies]
explain = ["shap>=0.45", "matplotlib>=3.8"]
dev = ["pytest>=8.0", "httpx>=0.27", "shap>=0.45", "matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
filterwarnings = ["ignore::DeprecationWarning"]
